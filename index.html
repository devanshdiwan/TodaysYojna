<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Links</title>
<style>
  :root{--maxw:420px}
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:system-ui,-apple-system,Inter,Roboto,Arial,sans-serif;
    background:#0e0f12;
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
    flex-direction:column;
  }
  .wrap{width:100%;max-width:var(--maxw);text-align:center}
  .avatar{width:120px;height:120px;border-radius:50%;overflow:hidden;margin:0 auto 10px;border:2px solid #ffffff22}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .name{font-weight:700;font-size:1.5rem}
  .bio{color:#cfd3da;margin-bottom:18px}
  .links{display:flex;flex-direction:column;gap:12px;margin-top:10px}
  .link{
    display:flex;align-items:center;gap:10px;text-decoration:none;background:#eee;color:#111;
    padding:14px;border-radius:14px;font-weight:700;border:1px solid #00000010
  }
  .link:active{transform:translateY(1px)}
  .icon{
    width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;
    background:#fff;display:grid;place-items:center;border:1px solid #00000014;
  }
  .icon img{width:100%;height:100%;object-fit:cover}
  .foot{margin-top:20px;opacity:.7}
  .ad-container{
    width:100%;
    max-width:320px;
    height:50px;
    margin:10px auto;
    background:#fff;
    border-radius:8px;
    overflow:hidden;
    text-align:center;
  }
</style>
</head>
<body>

  <!-- 🟢 Top Adsterra Banner -->
 <div class="ad-container" style="margin-bottom:50px;">
    <script type="text/javascript">
      atOptions = {
        'key': '8e625dc614d4585710f16774afac669e',
        'format': 'iframe',
        'height': 50,
        'width': 320,
        'params': {}
      };
    </script>
    <script type="text/javascript" src="//www.highperformanceformat.com/8e625dc614d4585710f16774afac669e/invoke.js"></script>
  </div>

  <main class="wrap">
    <div class="avatar"><img id="avatar" alt=""></div>
    <div class="name" id="name">Loading…</div>
    <div class="bio" id="bio"></div>
    <div id="links" class="links" aria-label="Links"></div>
  </main>

  <!-- 🟢 Bottom Adsterra Banner -->
  <div class="ad-container" style="margin-top:50px;">
    <script type="text/javascript">
      atOptions = {
        'key': '8e625dc614d4585710f16774afac669e',
        'format': 'iframe',
        'height': 50,
        'width': 320,
        'params': {}
      };
    </script>
    <script type="text/javascript" src="//www.highperformanceformat.com/8e625dc614d4585710f16774afac669e/invoke.js"></script>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
  import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB6S12pE6M9LbWJC0-wX9dJAboGZ2cYmy0",
    authDomain: "skillforgex-6aaa1.firebaseapp.com",
    databaseURL: "https://skillforgex-6aaa1-default-rtdb.firebaseio.com",
    projectId: "skillforgex-6aaa1",
    storageBucket: "skillforgex-6aaa1.firebasestorage.app",
    messagingSenderId: "817642126335",
    appId: "1:817642126335:web:388f34f7d2e1a0432a85ca",
    measurementId: "G-CDK62W0PW1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const isAbsolute = (u)=>/^(https?:|mailto:|tel:)/i.test(u);
  const normalize = (u)=>{
    if(!u) return "#";
    u = u.trim();
    return isAbsolute(u) ? u : "https://" + u.replace(/^\/+/, "");
  };

  async function loadData(){
    try{
      const snap = await get(child(ref(db), "/"));
      const data = snap.exists() ? snap.val() : {};
      const profile = data.profile || {};
      const links = Array.isArray(data.links) ? data.links : [];

      document.getElementById("avatar").src = profile.avatar || "";
      document.getElementById("name").textContent = profile.name || "No name";
      document.getElementById("bio").textContent = profile.bio || "";

      const list = document.getElementById("links");
      list.innerHTML = "";
      links.forEach(item=>{
        const linkUrl = normalize(item.url);
        const a = document.createElement("a");
        a.className = "link";
        a.href = linkUrl;
        a.target = "_blank";
        a.rel = "noopener noreferrer";

        const ic = document.createElement("div");
        ic.className = "icon";
        if(item.icon && item.icon.startsWith("data:image")){
          const img = document.createElement("img");
          img.src = item.icon;
          img.alt = "";
          ic.appendChild(img);
        } else {
          ic.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#ccc"/></svg>';
        }

        const title = document.createElement("span");
        title.textContent = item.title || "Untitled";

        a.appendChild(ic);
        a.appendChild(title);
        list.appendChild(a);
      });
    }catch(err){
      console.error(err);
      document.getElementById("name").textContent = "Error loading data";
    }
  }
  loadData();
</script>

</body>
</html>
